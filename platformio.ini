; ==========================================================================
;  SkyDesk  -  PlatformIO build configuration
;  Board: ESP32-2432S028R  (CYD, "Cheap Yellow Display"), CYD2USB revision
; ==========================================================================
;
;  The panel is an ST7789 driven in ILI9341-compatible mode with color
;  inversion, so TFT_eSPI MUST keep ILI9341_2_DRIVER + TFT_INVERSION_ON.
;  Do not change the pin mapping or driver flags without a hardware reason
;  (see docs/02-hardware.md). Single-USB (original ILI9341) CYDs: replace
;  ILI9341_2_DRIVER with ILI9341_DRIVER and delete TFT_INVERSION_ON.

[platformio]
src_dir = firmware
include_dir = include
default_envs = usb

[env]
platform = espressif32
board = esp32dev
framework = arduino

monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time

; Dual ~1.9MB app slots so OTA updates fit alongside the running image.
board_build.partitions = min_spiffs.csv

lib_deps =
    bodmer/TFT_eSPI @ ^2.5.43
    bblanchon/ArduinoJson @ ^7.2.0
    ; microSD: SdFat, not the core's SD.h - one 512 B cache instead of 4 KB per open file,
    ; which TLS needs (docs/10 -> Hardware and budget). FAT16/FAT32 only (SDFAT_FILE_TYPE=1).
    greiman/SdFat @ ^2.2.3
    ; 3.0 setup portal: the WiFi-join QR on screen (docs/12). Only linked into the setup
    ; boot's code path; ~5 KB flash, a ~150 B buffer on the stack.
    ricmoo/QRCode @ ^0.0.1

build_flags =
    -D CORE_DEBUG_LEVEL=2
    -D SDFAT_FILE_TYPE=1

    ; ---- TFT_eSPI: configured entirely here, no User_Setup.h ----
    -D USER_SETUP_LOADED=1
    -D ILI9341_2_DRIVER=1
    -D TFT_INVERSION_ON=1
    -D TFT_RGB_ORDER=TFT_BGR
    -D TFT_WIDTH=240
    -D TFT_HEIGHT=320
    -D TFT_MISO=12
    -D TFT_MOSI=13
    -D TFT_SCLK=14
    -D TFT_CS=15
    -D TFT_DC=2
    -D TFT_RST=-1
    -D TFT_BL=21
    -D TFT_BACKLIGHT_ON=HIGH
    ; Touch (XPT2046) is bit-banged (firmware/touch_input.cpp); HSPI belongs to the microSD card.
    -D SPI_FREQUENCY=55000000
    -D SPI_READ_FREQUENCY=20000000
    ; Fonts (see docs/06-ui-spec.md -> Typography)
    -D LOAD_GLCD=1
    -D LOAD_FONT2=1
    -D LOAD_GFXFF=1
    -D SMOOTH_FONT=0

; --- USB flashing (default):  pio run -t upload  /  pio device monitor ---
[env:usb]
upload_speed = 921600

; --- OTA flashing:  pio run -e ota -t upload  (needs ENABLE_OTA 1) --------
; Host and password come from OTA_HOSTNAME / OTA_PASSWORD in include/secrets.h
; (tools/ota_auth.py) - never put the password here.
[env:ota]
upload_protocol = espota
extra_scripts = pre:tools/ota_auth.py
