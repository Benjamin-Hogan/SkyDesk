<!doctype html>
<html><head><meta charset="utf-8"><title>R1 Plane airliner</title><link rel="stylesheet" href="mock.css"></head>
<body>
<svg class="cyd" viewBox="0 0 320 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <path id="plane" d="M0,-11 C1.2,-11 1.6,-9 1.6,-7 L1.6,-2 L10,3 L10,5 L1.6,2.5 L1.2,8 L4,10 L4,11.5 L0,10.5 L-4,11.5 L-4,10 L-1.2,8 L-1.6,2.5 L-10,5 L-10,3 L-1.6,-2 L-1.6,-7 C-1.6,-9 -1.2,-11 0,-11 Z"/>
    <marker id="arr" viewBox="0 0 6 6" refX="3" refY="3" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="var(--plane)"/></marker>
  </defs>

  <!-- Header band -->
  <rect x="0" y="0" width="320" height="34" fill="var(--panel)"/>
  <rect x="0" y="0" width="4" height="34" fill="var(--plane)"/>
  <text x="12" y="25" class="fsb12 c-text">Southwest 1637</text>
  <rect x="274" y="8" width="38" height="18" rx="9" fill="none" stroke="var(--plane)" stroke-width="1.5"/>
  <text x="293" y="21" class="f2 c-plane mid">+1</text>

  <!-- Sky dome: centre = straight up, edge = horizon, N up -->
  <g transform="translate(84,118)">
    <circle r="72" fill="var(--panel)" stroke="var(--hair)" stroke-width="1.5"/>
    <circle r="48" fill="none" stroke="var(--hair)" stroke-dasharray="2 3"/>
    <circle r="24" fill="none" stroke="var(--hair)" stroke-dasharray="2 3"/>
    <line x1="0" y1="-72" x2="0" y2="72" stroke="var(--hair)"/>
    <line x1="-72" y1="0" x2="72" y2="0" stroke="var(--hair)"/>
    <circle r="2" fill="var(--muted)"/>
    <!-- facing arc at az 45 on the rim -->
    <path d="M 38.2,-61.1 A 72 72 0 0 1 61.1,-38.2" fill="none" stroke="var(--plane)" stroke-width="5"/>
    <text x="0" y="-58" class="f2 c-text mid" font-weight="700">N</text>
    <text x="62" y="5" class="f2 c-muted mid">E</text>
    <text x="0" y="68" class="f2 c-muted mid">S</text>
    <text x="-62" y="5" class="f2 c-muted mid">W</text>
    <!-- 30 s trail -->
    <line x1="27.2" y1="-27.2" x2="12" y2="-41" stroke="var(--plane)" stroke-width="1.5" stroke-dasharray="3 2" marker-end="url(#arr)"/>
    <use href="#plane" transform="translate(27.2,-27.2) rotate(-45) scale(0.95)" fill="var(--plane)"/>
  </g>

  <!-- Where to look -->
  <text x="170" y="54" class="glcd c-dim">LOOK</text>
  <text x="168" y="92" class="fsb24 c-plane">NE</text>
  <text x="312" y="92" class="fsb18 c-text end">42°</text>
  <text x="170" y="110" class="f2 c-muted">up · about 4 fists</text>
  <line x1="170" y1="120" x2="312" y2="120" stroke="var(--hair)"/>

  <!-- Route + type -->
  <text x="170" y="146" class="fsb12 c-text">PHX → DEN</text>
  <text x="170" y="164" class="f2 c-muted">Phoenix → Denver</text>
  <text x="170" y="186" class="f2 c-text">Boeing 737-700</text>

  <!-- Stats bar -->
  <rect x="0" y="200" width="320" height="40" fill="var(--panel)"/>
  <g>
    <text x="10"  y="213" class="glcd c-dim">ALT  ▲</text>  <text x="10"  y="233" class="fsb9 c-text">12,400</text>
    <text x="90"  y="213" class="glcd c-dim">SPEED</text>   <text x="90"  y="233" class="fsb9 c-text">287</text><text x="124" y="233" class="f2 c-muted">mph</text>
    <text x="170" y="213" class="glcd c-dim">DIST</text>    <text x="170" y="233" class="fsb9 c-text">2.1</text><text x="197" y="233" class="f2 c-muted">mi</text>
    <text x="250" y="213" class="glcd c-dim">HEADING</text> <text x="250" y="233" class="fsb9 c-text">NW</text>
  </g>
</svg>
</body></html>
